global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: opswatch-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
        labels:
          app: opswatch
          service: api

  - job_name: opswatch-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9100
        labels:
          app: opswatch
          service: worker
