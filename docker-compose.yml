services:
  postgres:
    image: postgres:16-alpine
    labels:
      opswatch.logs: "true"
      opswatch.service: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opswatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opswatch}
      POSTGRES_DB: ${POSTGRES_DB:-opswatch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opswatch} -d ${POSTGRES_DB:-opswatch}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    labels:
      opswatch.logs: "true"
      opswatch.service: pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-U", "opswatch", "-d", "opswatch"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  api:
    build: .
    init: true
    labels:
      opswatch.logs: "true"
      opswatch.service: api
    environment:
      APP_VERSION: ${APP_VERSION:-0.4.0}
      GIT_SHA: ${GIT_SHA:-local}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-for-local-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://opswatch:opswatch@pgbouncer:6432/opswatch}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql+psycopg://opswatch:opswatch@postgres:5432/opswatch}
    depends_on:
      pgbouncer:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn opswatch.api.main:app --host 0.0.0.0 --port 8000 --no-access-log"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  worker:
    build: .
    init: true
    labels:
      opswatch.logs: "true"
      opswatch.service: worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://opswatch:opswatch@pgbouncer:6432/opswatch}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9100}
    expose:
      - "9100"
    depends_on:
      api:
        condition: service_healthy
    command: python -m opswatch.worker.main
    healthcheck:
      test: ["CMD", "python", "-m", "opswatch.worker.health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  failure-lab:
    build: .
    init: true
    labels:
      opswatch.logs: "true"
      opswatch.service: failure-lab
    command: uvicorn opswatch.failure_lab.main:app --host 0.0.0.0 --port 9000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    labels:
      opswatch.logs: "true"
      opswatch.service: prometheus
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/-/healthy >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.2.0
    labels:
      opswatch.logs: "true"
      opswatch.service: grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.0
    labels:
      opswatch.logs: "true"
      opswatch.service: loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command:
      - -config.file=/etc/loki/loki.yml
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.18.0
    labels:
      opswatch.logs: "true"
      opswatch.service: alloy
    depends_on:
      loki:
        condition: service_started
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    labels:
      opswatch.logs: "true"
      opswatch.service: nginx
    depends_on:
      api:
        condition: service_healthy
      failure-lab:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
