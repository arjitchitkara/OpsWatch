<!doctype html>
<html lang="en" data-theme="opswatch">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}OpsWatch{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css?v={{ static_asset_version }}">
    <script src="/static/app.js?v={{ static_asset_version }}" defer></script>
  </head>
  <body class="min-h-screen bg-base-100 text-base-content antialiased" {% block body_attributes %}{% endblock %}>
    <a class="btn btn-primary fixed left-3 top-3 z-50 -translate-y-24 focus:translate-y-0" href="#main-content">Skip to content</a>
    <header class="sticky top-0 z-30 border-b border-base-300 bg-base-100/95 backdrop-blur">
      <div class="navbar mx-auto min-h-16 max-w-7xl gap-3 px-4 sm:px-6">
        <div class="navbar-start min-w-0">
          <a href="/" class="flex min-w-0 items-center gap-3 rounded-md font-semibold tracking-wide">
            <span class="inline-block h-3 w-3 shrink-0 rounded-full bg-primary shadow-[0_0_18px_rgba(99,212,113,0.75)]"></span>
            <span class="truncate text-lg">OpsWatch</span>
          </a>
        </div>
        <nav class="navbar-center hidden items-center gap-1 md:flex" aria-label="Main navigation">
          <a class="btn btn-sm {% if current_path == '/' %}btn-primary{% else %}btn-ghost text-base-content/65{% endif %}" href="/" {% if current_path == '/' %}aria-current="page"{% endif %}>Overview</a>
          <a class="btn btn-sm {% if current_path.startswith('/monitors') %}btn-primary{% else %}btn-ghost text-base-content/65{% endif %}" href="/monitors" {% if current_path.startswith('/monitors') %}aria-current="page"{% endif %}>Monitors</a>
          <a class="btn btn-sm {% if current_path.startswith('/incidents') %}btn-primary{% else %}btn-ghost text-base-content/65{% endif %}" href="/incidents" {% if current_path.startswith('/incidents') %}aria-current="page"{% endif %}>Incidents</a>
        </nav>
        <div class="navbar-end gap-2">
          <form class="hidden md:block" action="/logout" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button class="btn btn-ghost btn-sm text-base-content/65" type="submit">Sign out</button>
          </form>
          <details class="dropdown dropdown-end md:hidden">
            <summary class="btn btn-square btn-ghost" aria-label="Open navigation menu">
              <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </summary>
            <ul class="menu dropdown-content z-40 mt-3 w-52 rounded-box border border-base-300 bg-base-200 p-2 shadow-xl">
              <li><a href="/" {% if current_path == '/' %}class="menu-active" aria-current="page"{% endif %}>Overview</a></li>
              <li><a href="/monitors" {% if current_path.startswith('/monitors') %}class="menu-active" aria-current="page"{% endif %}>Monitors</a></li>
              <li><a href="/incidents" {% if current_path.startswith('/incidents') %}class="menu-active" aria-current="page"{% endif %}>Incidents</a></li>
              <li class="mt-1 border-t border-base-300 pt-1">
                <form action="/logout" method="post">
                  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                  <button class="w-full justify-start" type="submit">Sign out</button>
                </form>
              </li>
            </ul>
          </details>
        </div>
      </div>
    </header>
    <main id="main-content" class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 sm:py-8">
      {% if flash_message %}
      <div id="flash-message" role="status" class="alert mb-6 border {% if flash_message.category == 'warning' %}border-warning/35 bg-warning/10 text-warning{% elif flash_message.category == 'error' %}border-error/35 bg-error/10 text-error{% else %}border-success/35 bg-success/10 text-success{% endif %}">
        <span>{{ flash_message.message }}</span>
        <button class="btn btn-ghost btn-sm" type="button" data-dismiss="flash-message" aria-label="Dismiss message">Close</button>
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
